<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigate: where geocoders miss in Hyderabad</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b2a49;        /* survey-sheet blue: text and rules */
  --ink-soft: #55627d;
  --paper: #eef1ec;      /* sheet margin */
  --panel: #fbfcfa;
  --rule: #c9d2cc;
  --hit: #0e7c6b;        /* within 100 m */
  --close: #8fa63a;      /* within 500 m */
  --off: #e08e1b;        /* within 2 km */
  --lost: #b8235a;       /* beyond 2 km */
  --silent: #8a93a0;     /* no answer */
  --font: "Archivo", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); color: var(--ink); background: var(--paper); font-size: 15px; line-height: 1.45; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lost); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(340px, 430px) 1fr; grid-template-rows: auto 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 18px; padding: 12px 20px 10px; border-bottom: 2px solid var(--ink); background: var(--panel); }
header h1 { font-size: 22px; font-stretch: 80%; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--ink-soft); flex: 1; min-width: 0; }
header nav { display: flex; gap: 4px; }
header nav button { border: 1px solid var(--ink); background: transparent; padding: 4px 12px; cursor: pointer; }
header nav button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
header a { color: var(--ink); }

.side { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--rule); padding: 14px 18px 30px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 3px; }
select, input[type="search"] { width: 100%; padding: 6px 8px; border: 1px solid var(--rule); background: #fff; border-radius: 2px; }
.about { font-size: 13px; color: var(--ink-soft); margin: -4px 0 12px; min-height: 1.4em; }

.figures { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 12px 0 6px; }
.figures div { padding: 8px 6px 7px 0; }
.figures b { display: block; font-size: 24px; font-stretch: 78%; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.figures span { font-size: 12px; color: var(--ink-soft); }

.hist { display: flex; align-items: flex-end; gap: 3px; height: 92px; margin: 14px 0 2px; }
.hist button { flex: 1; border: 0; padding: 0; background: none; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.hist i { display: block; width: 100%; min-height: 2px; }
.hist button[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--ink); }
.histlab { display: flex; gap: 3px; font-size: 10.5px; color: var(--ink-soft); text-align: center; }
.histlab span { flex: 1; }
.hint { font-size: 12px; color: var(--ink-soft); margin: 6px 0 14px; }

.cases { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.cases li { border-bottom: 1px solid var(--rule); }
.cases button { display: grid; grid-template-columns: 76px 1fr; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 0; cursor: pointer; }
.cases button:hover, .cases button[aria-current="true"] { background: #e6ebe5; }
.cases .d { font-variant-numeric: tabular-nums; font-weight: 650; text-align: right; white-space: nowrap; }
.cases .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listhead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.listhead h2 { font-size: 15px; margin: 0 0 6px; }
.listhead button { border: 0; background: none; text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }

.stage { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: #dfe5df; }
.leaflet-tile { filter: grayscale(0.9) contrast(0.92) brightness(1.06); }
.leaflet-container { font-family: var(--font); }

/* the selected address, shown like the label on a parcel */
.label { position: absolute; left: 16px; right: 16px; bottom: 16px; max-width: 760px; z-index: 600; background: var(--panel); border: 2px solid var(--ink); padding: 14px 16px 12px; display: none; }
.label.on { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; }
.label .typed { font-size: 19px; line-height: 1.3; font-weight: 500; overflow-wrap: anywhere; }
.label .miss { text-align: right; white-space: nowrap; }
.label .miss b { font-size: 34px; font-stretch: 76%; font-weight: 700; line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.label .miss span { font-size: 12.5px; color: var(--ink-soft); }
.label .facts { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
.label .facts em { font-style: normal; color: var(--ink); }
.label .parts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--rule); }
.label .parts span { color: var(--ink-soft); }
.label .close { position: absolute; top: -13px; right: 10px; background: var(--ink); color: var(--panel); border: 0; padding: 2px 9px; cursor: pointer; font-size: 13px; }
.key { position: absolute; top: 12px; right: 12px; z-index: 500; background: rgba(251,252,250,.94); border: 1px solid var(--ink); padding: 8px 10px; font-size: 12.5px; }
.key div { display: flex; align-items: center; gap: 7px; }
.key i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.key .mk { width: 12px; height: 12px; border-radius: 0; border: 2px solid var(--ink); background: #fff; }
.key .mk.p { background: var(--ink); transform: rotate(45deg); }

.board { grid-column: 1 / -1; overflow: auto; padding: 18px 22px 40px; display: none; background: var(--panel); }
.board h2 { font-size: 17px; margin: 22px 0 4px; }
.board h2:first-child { margin-top: 0; }
.board p { max-width: 74ch; color: var(--ink-soft); margin: 0 0 10px; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
th, td { padding: 5px 14px 5px 0; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 600; border-bottom: 1px solid var(--ink); font-size: 13px; vertical-align: bottom; }
th:first-child, td:first-child { text-align: left; }
td.best { font-weight: 700; }
.view-board .side, .view-board .stage { display: none; }
.view-board .board { display: block; }
.empty { padding: 30px 0; color: var(--ink-soft); }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 52vh auto; height: auto; }
  header { flex-wrap: wrap; }
  header p { flex-basis: 100%; order: 3; }
  header nav { margin-left: auto; }
  .stage { grid-row: 2; }
  .side { grid-row: 3; border-right: 0; }
  .label .typed { font-size: 16px; }
  .label .miss b { font-size: 26px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Navigate</h1>
    <p>Where address geocoders miss in Hyderabad, one address at a time. <a href="https://github.com/SiddharthaRaja/Navigate">Code and benchmark</a></p>
    <nav aria-label="View">
      <button id="vMap" aria-pressed="true">Map</button>
      <button id="vBoard" aria-pressed="false">Leaderboard</button>
    </nav>
  </header>

  <aside class="side">
    <div class="row">
      <div><label for="model">Geocoder</label><select id="model"></select></div>
      <div><label for="split">Test set</label><select id="split"></select></div>
    </div>
    <p class="about" id="about"></p>
    <div class="row">
      <div><label for="fStyle">Address style</label><select id="fStyle"></select></div>
      <div><label for="fRel">Landmark relation</label><select id="fRel"></select></div>
    </div>
    <div class="row">
      <div><label for="fNoise">Noise</label><select id="fNoise"></select></div>
      <div><label for="fGaz">Landmark known to the gazetteer</label><select id="fGaz"></select></div>
    </div>
    <label for="q">Find text in the address</label>
    <input type="search" id="q" placeholder="opp, masjid, 500034 …">

    <div class="figures" aria-live="polite">
      <div><b id="sN">–</b><span>addresses</span></div>
      <div><b id="sMed">–</b><span>median miss</span></div>
      <div><b id="s100">–</b><span>within 100 m</span></div>
      <div><b id="s500">–</b><span>within 500 m</span></div>
    </div>
    <div class="hist" id="hist" role="group" aria-label="Addresses by size of miss"></div>
    <div class="histlab" id="histlab"></div>
    <p class="hint">Select a bar to keep only that range. Select it again to clear.</p>

    <div class="listhead"><h2 id="listTitle">Largest misses</h2><button id="flip">Show smallest first</button></div>
    <ul class="cases" id="cases"></ul>
  </aside>

  <section class="stage">
    <div id="map"></div>
    <div class="key" id="key"></div>
    <div class="label" id="label"></div>
  </section>

  <section class="board" id="board"></section>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
// ---------------------------------------------------------------- setup
const BUCKETS = [
  { max: 50, lab: "≤50 m" }, { max: 100, lab: "100" }, { max: 200, lab: "200" }, { max: 500, lab: "500" },
  { max: 1000, lab: "1 km" }, { max: 2000, lab: "2 km" }, { max: 5000, lab: "5 km" }, { max: Infinity, lab: ">5 km" },
  { max: null, lab: "none" },
];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colour = e => e == null ? css("--silent") : e <= 100 ? css("--hit") : e <= 500 ? css("--close") : e <= 2000 ? css("--off") : css("--lost");
const bucketOf = e => e == null ? 8 : BUCKETS.findIndex(b => b.max !== null && e <= b.max);
const dist = m => m == null ? "no answer" : m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(m < 10000 ? 1 : 0) + " km";
const pct = v => v == null || isNaN(v) ? "–" : Math.round(v * 100) + "%";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let D, state = { model: null, split: null, bucket: null, sel: null, asc: false }, map, layer, overlay, markers = [];

fetch("data/explorer.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(start).catch(err => {
  $("cases").innerHTML = `<li class="empty">No results file yet. Run notebook 09 to write docs/data/explorer.json, then reload. (${esc(err.message)})</li>`;
});

function start(data) {
  D = data;
  const R = D.rows;
  fill("model", D.models.map(m => [m.name, m.name.replace(/_/g, " ")]));
  fill("split", D.meta.splits.map(s => [s, splitName(s)]));
  const uniq = k => [...new Set(R[k].filter(v => v != null))].sort();
  fill("fStyle", [["", "any"], ...uniq("style").map(v => [v, v])]);
  fill("fRel", [["", "any"], ...uniq("relation").map(v => [v, v.toLowerCase().replace(/_/g, " ")])]);
  fill("fNoise", [["", "any"], ...["clean", "light", "heavy", "real"].filter(v => R.noise_level.includes(v)).map(v => [v, v])]);
  fill("fGaz", [["", "any"], ...uniq("ref_in_gazetteer").map(v => [v, v.replace("landmark ", "")])]);
  const pick = D.models.find(m => m.kind !== "reference" && !/centroid/.test(m.name)) || D.models[0];
  $("model").value = state.model = pick.name;
  $("split").value = state.split = D.meta.splits.includes("test_warm") ? "test_warm" : D.meta.splits[0];

  map = L.map("map", { preferCanvas: true, zoomControl: true }).setView([17.42, 78.47], 11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  overlay = L.layerGroup().addTo(map);

  ["model", "split", "fStyle", "fRel", "fNoise", "fGaz"].forEach(id => $(id).addEventListener("change", () => { state.model = $("model").value; state.split = $("split").value; state.sel = null; draw(true); }));
  $("q").addEventListener("input", () => draw(false));
  $("flip").addEventListener("click", () => { state.asc = !state.asc; draw(false); });
  $("vMap").addEventListener("click", () => view(false));
  $("vBoard").addEventListener("click", () => view(true));
  draw(true);
}

function fill(id, opts) { $(id).innerHTML = opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join(""); }
function splitName(s) { return { test_warm: "Warm: unseen buildings, seen areas", test_cold: "Cold: areas never seen in training", test_rel: "Relations: fixed number per relation", test_real: "Real: addresses typed by mappers" }[s] || s; }
function view(board) {
  $("app").classList.toggle("view-board", board);
  $("vMap").setAttribute("aria-pressed", !board); $("vBoard").setAttribute("aria-pressed", board);
  if (board) drawBoard(); else map.invalidateSize();
}

// ---------------------------------------------------------------- filtering
function rowsNow(ignoreBucket) {
  const R = D.rows, P = D.pred[state.model], q = $("q").value.trim().toLowerCase();
  const f = { style: $("fStyle").value, relation: $("fRel").value, noise_level: $("fNoise").value, ref_in_gazetteer: $("fGaz").value };
  const out = [];
  for (let i = 0; i < R.id.length; i++) {
    if (R.split[i] !== state.split || R.abstain[i]) continue;
    if (f.style && R.style[i] !== f.style) continue;
    if (f.relation && R.relation[i] !== f.relation) continue;
    if (f.noise_level && R.noise_level[i] !== f.noise_level) continue;
    if (f.ref_in_gazetteer && R.ref_in_gazetteer[i] !== f.ref_in_gazetteer) continue;
    if (q && !R.text[i].toLowerCase().includes(q)) continue;
    if (!ignoreBucket && state.bucket !== null && bucketOf(P.err[i]) !== state.bucket) continue;
    out.push(i);
  }
  return out;
}

// ---------------------------------------------------------------- drawing
function draw(refit) {
  const P = D.pred[state.model], M = D.models.find(m => m.name === state.model), R = D.rows;
  $("about").textContent = M.about || "";
  const all = rowsNow(true), idx = state.bucket === null ? all : rowsNow(false);

  // figures (always for the filter without the bar selection, so the bars stay comparable)
  const errs = all.map(i => P.err[i]).filter(e => e != null).sort((a, b) => a - b);
  $("sN").textContent = all.length.toLocaleString();
  $("sMed").textContent = errs.length ? dist(errs[Math.floor(errs.length / 2)]) : "–";
  $("s100").textContent = all.length ? pct(errs.filter(e => e <= 100).length / all.length) : "–";
  $("s500").textContent = all.length ? pct(errs.filter(e => e <= 500).length / all.length) : "–";

  // bars
  const counts = BUCKETS.map(() => 0);
  all.forEach(i => counts[bucketOf(P.err[i])]++);
  const top = Math.max(1, ...counts);
  $("hist").innerHTML = BUCKETS.map((b, k) => {
    const c = k === 8 ? css("--silent") : colour(k === 0 ? 50 : BUCKETS[k - 1].max + 1);
    return `<button aria-pressed="${state.bucket === k}" data-k="${k}" title="${counts[k]} addresses"><i style="height:${Math.round(100 * counts[k] / top)}%;background:${c}"></i></button>`;
  }).join("");
  $("histlab").innerHTML = BUCKETS.map(b => `<span>${b.lab}</span>`).join("");
  $("hist").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { const k = +b.dataset.k; state.bucket = state.bucket === k ? null : k; draw(false); }));

  // map points sit at the TRUE location, coloured by how far the answer was
  layer.clearLayers(); markers = {};
  const pts = [];
  idx.forEach(i => {
    const m = L.circleMarker([R.lat[i], R.lon[i]], { radius: 4, weight: 0, fillOpacity: 0.78, fillColor: colour(P.err[i]) });
    m.on("click", () => select(i, false)); m.addTo(layer); markers[i] = m; pts.push([R.lat[i], R.lon[i]]);
  });
  if (refit && pts.length) map.fitBounds(pts, { padding: [30, 30] });

  // list
  const order = idx.slice().sort((a, b) => { const x = P.err[a] ?? Infinity, y = P.err[b] ?? Infinity; return state.asc ? x - y : y - x; }).slice(0, 150);
  $("listTitle").textContent = state.asc ? "Smallest misses" : "Largest misses";
  $("flip").textContent = state.asc ? "Show largest first" : "Show smallest first";
  $("cases").innerHTML = order.length ? order.map(i => `<li><button data-i="${i}" aria-current="${state.sel === i}"><span class="d" style="color:${colour(P.err[i])}">${dist(P.err[i])}</span><span class="t">${esc(R.text[i])}</span></button></li>`).join("")
    : `<li class="empty">No addresses match these filters. Clear a filter or the search box.</li>`;
  $("cases").querySelectorAll("button").forEach(b => b.addEventListener("click", () => select(+b.dataset.i, true)));

  $("key").innerHTML = `<div><i style="background:${css("--hit")}"></i>within 100 m</div><div><i style="background:${css("--close")}"></i>within 500 m</div><div><i style="background:${css("--off")}"></i>within 2 km</div><div><i style="background:${css("--lost")}"></i>beyond 2 km</div><div><i style="background:${css("--silent")}"></i>no answer</div>`;
  if (state.sel !== null && idx.includes(state.sel)) select(state.sel, false); else { overlay.clearLayers(); $("label").classList.remove("on"); }
}

function select(i, fly) {
  state.sel = i;
  const R = D.rows, P = D.pred[state.model], M = D.models.find(m => m.name === state.model);
  overlay.clearLayers();
  const truth = [R.lat[i], R.lon[i]], box = [truth];
  L.circleMarker(truth, { radius: 8, color: css("--ink"), weight: 3, fillColor: "#fff", fillOpacity: 1 }).bindTooltip("true building").addTo(overlay);
  if (R.ref_lat[i] != null) {
    const ref = [R.ref_lat[i], R.ref_lon[i]]; box.push(ref);
    L.polyline([truth, ref], { color: css("--ink"), weight: 1.5, dashArray: "3 5" }).addTo(overlay);
    L.circleMarker(ref, { radius: 6, color: css("--ink"), weight: 2, fillColor: css("--close"), fillOpacity: 1 }).bindTooltip("landmark in the text: " + R.ref_name[i]).addTo(overlay);
  }
  if (M.points && P.lat && P.lat[i] != null) {
    const p = [P.lat[i], P.lon[i]]; box.push(p);
    L.polyline([truth, p], { color: colour(P.err[i]), weight: 3 }).addTo(overlay);
    L.circleMarker(p, { radius: 7, color: "#fff", weight: 2, fillColor: colour(P.err[i]), fillOpacity: 1 }).bindTooltip("answer from " + M.name.replace(/_/g, " ")).addTo(overlay);
  }
  if (fly) map.fitBounds(box, { padding: [90, 90], maxZoom: 17 });

  let comps = {}; try { comps = JSON.parse(R.components[i] || "{}"); } catch (e) {}
  const facts = [];
  if (R.style[i]) facts.push(`style <em>${esc(R.style[i])}</em>`);
  if (R.relation[i]) facts.push(`relation <em>${esc(R.relation[i].toLowerCase().replace(/_/g, " "))}</em>`);
  if (R.noise_ops[i]) facts.push(`noise <em>${esc(R.noise_ops[i].replace(/,/g, ", ").replace(/_/g, " "))}</em>`);
  if (R.ref_name[i]) facts.push(`landmark <em>${esc(R.ref_name[i])}</em> is ${dist(R.ref_dist[i])} away${R.ref_in_gazetteer[i] === "landmark hidden" ? ", <em>hidden from the gazetteer</em>" : ""}`);
  if (R.oracle[i] != null) facts.push(`best place named in the text is <em>${dist(R.oracle[i])}</em> from the building`);
  if (P.level && P.level[i]) facts.push(`matched on <em>${esc(P.level[i].replace(/_/g, " "))}</em>`);
  if (!M.points && M.kind === "paid") facts.push("this provider's terms do not allow its points on this map, so only the distance is shown");
  $("label").innerHTML = `<button class="close" aria-label="Close this address">Close</button>
    <div class="typed">${esc(R.text[i])}</div>
    <div class="miss"><b style="color:${colour(P.err[i])}">${dist(P.err[i])}</b><span>${P.err[i] == null ? "from " : "miss by "}${esc(M.name.replace(/_/g, " "))}</span></div>
    <div class="facts">${facts.join("; ")}.</div>
    ${Object.keys(comps).length ? `<div class="parts">${Object.entries(comps).map(([k, v]) => `<div><span>${esc(k.replace(/_/g, " "))}</span> ${esc(v)}</div>`).join("")}</div>` : ""}`;
  $("label").classList.add("on");
  $("label").querySelector(".close").addEventListener("click", () => { state.sel = null; overlay.clearLayers(); $("label").classList.remove("on"); });
  $("cases").querySelectorAll("button").forEach(b => b.setAttribute("aria-current", +b.dataset.i === i));
}

// ---------------------------------------------------------------- leaderboard
function drawBoard() {
  const res = D.results, cols = [["n", "addresses", v => v.toLocaleString()], ["coverage", "answered", pct], ["acc@100", "within 100 m", pct], ["acc@500", "within 500 m", pct],
    ["acc@1000", "within 1 km", pct], ["p50", "median miss", dist], ["p90", "90th percentile", dist], ["misroute", "wrong pincode area", pct]];
  let h = "";
  const order = ["test_warm", "test_cold", "test_rel", "test_real"];
  D.meta.splits.slice().sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99).forEach(sp => {
    const rows = res.filter(r => r.split === sp && r.slice === "overall" && !(/oracle/.test(r.model) && !r.coverage));
    if (!rows.length) return;
    const real = rows.filter(r => !/oracle/.test(r.model));
    const best = {}; cols.forEach(([k]) => { const v = real.filter(r => !/p50|p90/.test(k) || (r.coverage ?? 0) >= 0.5).map(r => r[k]).filter(x => x != null); best[k] = /acc/.test(k) ? Math.max(...v) : /p50|p90|misroute/.test(k) ? Math.min(...v) : null; });
    h += `<h2>${esc(splitName(sp))}</h2><table><tr><th>Geocoder</th>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr>` +
      rows.map(r => `<tr><td>${esc(r.model.replace(/_/g, " "))}</td>${cols.map(([k, , f]) => `<td class="${!/oracle/.test(r.model) && best[k] != null && r[k] === best[k] ? "best" : ""}">${r[k] == null ? "–" : f(r[k])}</td>`).join("")}</tr>`).join("") + "</table>";
  });
  const sl = res.filter(r => r.model === state.model && r.split === state.split && r.slice !== "overall");
  if (sl.length) {
    h += `<h2>${esc(state.model.replace(/_/g, " "))} by slice, ${esc(splitName(state.split).toLowerCase())}</h2><p>Each row is one kind of address. Slices with fewer than 30 addresses are left out.</p><table><tr><th>Slice</th><th>addresses</th><th>within 100 m</th><th>within 500 m</th><th>median miss</th></tr>` +
      sl.map(r => `<tr><td>${esc(r.slice.replace(/_/g, " "))}: ${esc(String(r.value).toLowerCase().replace(/_/g, " "))}</td><td>${r.n}</td><td>${pct(r["acc@100"])}</td><td>${pct(r["acc@500"])}</td><td>${r.p50 == null ? "–" : dist(r.p50)}</td></tr>`).join("") + "</table>";
  }
  h += `<h2>How to read this</h2><p>Every test address has a known true building. A miss is the straight-line distance from a geocoder's answer to that building. An address with no answer counts as a miss in the "within" columns; the median and 90th percentile are over answered addresses only, so they are not marked best for a geocoder that answered fewer than half. "Oracle reference" is the distance from the building to the best place actually named in the text: it shows how much the text itself pins down. ${esc(D.meta.note || "")} Generated ${esc(D.meta.generated)}.</p>
  <p>Map data and real address text: OpenStreetMap contributors (ODbL). Synthetic addresses are generated from that map; flat and house numbers in them are invented.</p>`;
  $("board").innerHTML = h;
}
</script>
</body>
</html>
